name: Update GitHub analytics

on:
  schedule:
    # Runs every day at 06:00 Sri Lanka time.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh analytics files
        shell: pwsh
        run: |
          $stamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $readme = Get-Content README.md -Raw
          $readme = [regex]::Replace(
            $readme,
            'github-analytics\.svg\?v=[^"]+',
            "github-analytics.svg?v=$stamp"
          )
          Set-Content README.md $readme -NoNewline

          $svg = Get-Content github-analytics.svg -Raw
          if ($svg -match '<!-- updated: .*? -->') {
            $svg = [regex]::Replace($svg, '<!-- updated: .*? -->', "<!-- updated: $stamp -->")
          } else {
            $svg = $svg -replace '<svg ', "<svg `n<!-- updated: $stamp -->`n"
          }
          Set-Content github-analytics.svg $svg -NoNewline

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update GitHub analytics
          file_pattern: README.md github-analytics.svg
